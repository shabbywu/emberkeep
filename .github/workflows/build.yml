name: Build desktop releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-14
            target: macos-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test game rules and bridge
        run: python -m pytest -q
      - name: Build and verify final ZIP
        run: |
          mkdir -p build
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python tools/build_release.py --tag "$GITHUB_REF_NAME" 2>&1 | tee build/release-build.log
          else
            python tools/build_release.py --build-id "$GITHUB_SHA" 2>&1 | tee build/release-build.log
          fi
      - name: Upload verified release files
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/release-build.log
            build/diagnostics/
            build/Emberkeep/warn-Emberkeep.txt
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish verified bundles
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Check and publish release files
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 2
          cat ./*.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS.txt --verify-tag --generate-notes --title "Emberkeep $RELEASE_TAG"
          fi
