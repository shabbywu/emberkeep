[project]
name = "emberkeep"
version = "1.0.0"
description = "A four-floor, Python-authoritative pixel roguelike for ultralight-py 0.5.0"
requires-python = ">=3.10"
dependencies = ["ultralight-py==0.5.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "Pillow>=11,<13", "fonttools[woff]>=4.55"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 110
