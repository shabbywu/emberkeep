<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="ui.window_title">Emberkeep</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app" x-data="emberkeep" :class="{busy: !!ui.working}" :data-phase="s.phase" :aria-busy="!!ui.working">
  <header class="topbar">
    <div class="brand"><span class="sprite brand-torch"></span><div><b><localized-text data-i18n="ui.title" x-text="t($el.dataset.i18n)">烬灯地牢</localized-text></b><small>E M B E R K E E P</small></div></div>
    <nav class="floor-path" id="floorPath" :aria-label="t('ui.floor_progress')"><span :class="{active: s.floor === 1, cleared: s.floor > 1}">I</span><i></i><span :class="{active: s.floor === 2, cleared: s.floor > 2}">II</span><i></i><span :class="{active: s.floor === 3, cleared: s.floor > 3}">III</span><i></i><span :class="{active: s.floor === 4, cleared: s.floor > 4}">IV</span></nav>
    <div class="header-controls"><div id="languageSwitch" class="language-switch" role="group" aria-label="Language / 语言"><button id="languageEn" type="button" lang="en" :aria-pressed="ui.language === 'en'" :disabled="!!ui.working">English</button><button id="languageZh" type="button" lang="zh-CN" :aria-pressed="ui.language === 'zh-CN'" :disabled="!!ui.working">中文</button></div><span id="saveStatus" class="save-status" :class="{bad: !!s.save_error}" x-text="saveStatus"></span><button id="helpBtn" class="icon-button" :title="t('ui.help')">?</button><button id="pauseBtn" class="icon-button" :title="t('ui.pause')">Ⅱ</button></div>
  </header>
  <main class="main">
    <section class="world-panel">
      <div class="world-heading"><span><i class="tiny-flame"></i><b id="floorName" x-text="s.player ? t('ui.floor',{floor:s.floor,floors:s.floors,name:s.floor_name}) : t('ui.journey')"></b></span><span id="turnCount" x-text="s.player ? t('ui.turn',{turn:s.turn}) : t('ui.genre')"></span></div>
      <div class="viewport" id="viewport">
        <canvas id="board" width="368" height="272" tabindex="0" :aria-label="t('ui.canvas_label')"></canvas>
        <div class="world-vignette"></div>
        <div id="bossHud" class="boss-hud" :class="{hidden: !ui.bossVisible}"><div><b><localized-text data-i18n="ui.boss_name" x-text="t($el.dataset.i18n)">无灯守墓者</localized-text></b><span id="bossPhase" x-text="t(boss.rage ? 'ui.boss_rage' : 'ui.boss_calm')"></span></div><div class="boss-meter"><i id="bossFill" :style="{width: (100 * boss.hp / boss.max_hp) + '%'}"></i></div></div>
        <div id="overlay" class="overlay" :class="{hidden: !ui.dialogVisible}"><div id="card" :class="ui.dialogClass" x-html="ui.dialogHTML"></div></div>
        <div id="toast" class="toast" :class="{show: ui.toastVisible}" x-text="ui.toast" role="status"></div>
        <div id="error" class="error" :class="{hidden: !ui.error}" role="alert"><span id="errorText" x-text="ui.error"></span><button id="dismissError" :aria-label="t('ui.dismiss_error')">×</button></div>
        <div id="debug" class="debug" :class="{hidden: !ui.debugVisible}" x-text="ui.text.debug"></div>
      </div>
      <div class="world-footer"><span id="inspect" x-text="ui.text.inspect || t('ui.inspect')"></span><span id="seedLabel" x-text="s.player ? 'SEED ' + s.seed : t('ui.footsteps')"></span></div>
    </section>
    <aside class="sidebar">
      <div class="hero-card"><div class="portrait"><span class="sprite hero-portrait"></span></div><div><span class="eyebrow"><localized-text data-i18n="ui.hero_caption" x-text="t($el.dataset.i18n)">最后的守灯人</localized-text></span><h2><localized-text data-i18n="ui.hero_name" x-text="t($el.dataset.i18n)">旅人</localized-text><span id="levelLabel" x-text="'Lv. ' + hero.level"></span></h2><small id="heroSubtitle"><localized-text data-i18n="ui.hero_note" x-text="t($el.dataset.i18n)">灯在，归途就在。</localized-text></small></div></div>
      <div class="vitals"><div class="stat-label"><span><localized-text data-i18n="ui.health" x-text="t($el.dataset.i18n)">生命</localized-text></span><b id="hpText" x-text="hero.hp + ' / ' + hero.max_hp"></b></div><div class="meter hp-meter"><i id="hpFill" :style="{width: (100 * hero.hp / hero.max_hp) + '%'}"></i></div><div class="stat-label xp-label"><span><localized-text data-i18n="ui.experience" x-text="t($el.dataset.i18n)">灯火经验</localized-text></span><b id="xpText" x-text="p.xp + ' / ' + p.xp_next"></b></div><div class="meter xp-meter"><i id="xpFill" :style="{width: Math.min(100, 100 * p.xp / p.xp_next) + '%'}"></i></div><div class="attributes"><span><i class="sprite small sword-icon"></i><localized-text data-i18n="ui.attack" x-text="t($el.dataset.i18n)">锋刃 </localized-text><b id="attackText" x-text="hero.attack"></b></span><span><i class="sprite small shield-icon"></i><localized-text data-i18n="ui.armor" x-text="t($el.dataset.i18n)">护甲 </localized-text><b id="armorText" x-text="hero.armor"></b></span></div></div>
      <div class="skills"><div class="section-title"><localized-text data-i18n="ui.skills" x-text="t($el.dataset.i18n)">旅人的技艺</localized-text><span><localized-text data-i18n="ui.action_turn" x-text="t($el.dataset.i18n)">每次行动 · 一个回合</localized-text></span></div>
        <button id="whirlBtn" class="skill" :class="{cooldown: p.whirl_remaining > 0}"><span class="sprite whirl-icon"></span><span><b><localized-text data-i18n="ui.whirl" x-text="t($el.dataset.i18n)">旋风斩</localized-text><kbd>Q</kbd></b><small><localized-text data-i18n="ui.whirl_desc" x-text="t($el.dataset.i18n)">横扫四邻格的敌人</localized-text></small></span><em id="whirlCd" x-text="p.whirl_remaining ? t('ui.cooldown',{turns:p.whirl_remaining}) : t('ui.ready')"></em></button>
        <button id="boltBtn" class="skill" :class="{cooldown: p.bolt_remaining > 0}"><span class="sprite bolt-icon"></span><span><b><localized-text data-i18n="ui.bolt" x-text="t($el.dataset.i18n)">余烬弹</localized-text><kbd>E</kbd></b><small><localized-text data-i18n="ui.bolt_desc" x-text="t($el.dataset.i18n)">射程 4 格 · 点击敌人指定目标</localized-text></small></span><em id="boltCd" x-text="p.bolt_remaining ? t('ui.cooldown',{turns:p.bolt_remaining}) : t('ui.ready')"></em></button>
        <button id="healBtn" class="skill"><span class="sprite potion-icon"></span><span><b><localized-text data-i18n="ui.potion" x-text="t($el.dataset.i18n)">治疗药水</localized-text><kbd>R</kbd></b><small><localized-text data-i18n="ui.potion_desc" x-text="t($el.dataset.i18n)">恢复 18 生命 · 消耗一瓶</localized-text></small></span><em id="potionCount" x-text="'×' + hero.potions"></em></button>
        <button id="waitBtn" class="wait-button"><localized-text data-i18n="ui.wait" x-text="t($el.dataset.i18n)">静候一回合 </localized-text><kbd>Space</kbd></button>
      </div>
      <div class="run-stats"><span><i class="sprite small skull-icon"></i><localized-text data-i18n="ui.kills_short" x-text="t($el.dataset.i18n)">击败 </localized-text><b id="killsText" x-text="s.kills || 0"></b></span><span><i class="sprite small coin-icon"></i><localized-text data-i18n="ui.gold" x-text="t($el.dataset.i18n)">金币 </localized-text><b id="goldText" x-text="s.gold || 0"></b></span></div>
      <div class="journal"><div class="section-title"><localized-text data-i18n="ui.journal" x-text="t($el.dataset.i18n)">冒险日志</localized-text><span class="journal-mark">✦</span></div><div id="logLines" class="log-lines"><template x-for="(line,index) in ui.messages" :key="index"><p x-text="line"></p></template></div></div>
      <div class="danger-note"><span>!</span><localized-text data-i18n="ui.warning_note" x-text="t($el.dataset.i18n)"> 红色地格会在下一回合受到攻击。移动避开，灯火才会更长久。</localized-text></div>
    </aside>
  </main>
  <footer class="bottom"><span><localized-text data-i18n="ui.footer" x-text="t($el.dataset.i18n)">四层长夜 · 一盏烬灯</localized-text></span><span><localized-text data-i18n="ui.footer_keys" x-text="t($el.dataset.i18n)">Esc 暂停 &nbsp; F5 保存 &nbsp; F3 诊断</localized-text></span><span>EMBERKEEP <b>01</b></span></footer>
</div>
<script defer src="ui.js"></script>
<script defer src="vendor/alpine.min.js"></script>
<script defer src="game.js"></script>
</body>
</html>
