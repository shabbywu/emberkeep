<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="ui.window_title">Emberkeep</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app" data-phase="menu">
  <header class="topbar">
    <div class="brand"><span class="sprite brand-torch"></span><div><b><localized-text data-i18n="ui.title">烬灯地牢</localized-text></b><small>E M B E R K E E P</small></div></div>
    <nav class="floor-path" id="floorPath" aria-label="楼层进度" data-i18n-aria-label="ui.floor_progress"><span>I</span><i></i><span>II</span><i></i><span>III</span><i></i><span>IV</span></nav>
    <div class="header-controls"><div id="languageSwitch" class="language-switch" role="group" aria-label="Language / 语言"><button id="languageEn" type="button" lang="en" aria-pressed="true">English</button><button id="languageZh" type="button" lang="zh-CN" aria-pressed="false">中文</button></div><span id="saveStatus" class="save-status"><localized-text data-i18n="ui.idle">灯火待燃</localized-text></span><button id="helpBtn" class="icon-button" title="操作指南" data-i18n-title="ui.help">?</button><button id="pauseBtn" class="icon-button" title="暂停 · Esc" data-i18n-title="ui.pause">Ⅱ</button></div>
  </header>
  <main class="main">
    <section class="world-panel">
      <div class="world-heading"><span><i class="tiny-flame"></i><b id="floorName"><localized-text data-i18n="ui.journey">一盏灯，一次归途。</localized-text></b></span><span id="turnCount"><localized-text data-i18n="ui.genre">像素地牢 · 回合冒险</localized-text></span></div>
      <div class="viewport" id="viewport">
        <canvas id="board" width="368" height="272" tabindex="0" aria-label="地牢地图，WASD 移动，点击相邻地面移动或敌人攻击" data-i18n-aria-label="ui.canvas_label"></canvas>
        <div class="world-vignette"></div>
        <div id="bossHud" class="boss-hud hidden"><div><b><localized-text data-i18n="ui.boss_name">无灯守墓者</localized-text></b><span id="bossPhase"><localized-text data-i18n="ui.boss_calm">沉眠的旧王</localized-text></span></div><div class="boss-meter"><i id="bossFill"></i></div></div>
        <div id="overlay" class="overlay"><div id="card" class="dialog"></div></div>
        <div id="toast" class="toast" role="status"></div>
        <div id="error" class="error hidden" role="alert"><span id="errorText"></span><button id="dismissError" aria-label="关闭错误提示" data-i18n-aria-label="ui.dismiss_error">×</button></div>
        <div id="debug" class="debug hidden"></div>
      </div>
      <div class="world-footer"><span id="inspect"><localized-text data-i18n="ui.inspect">WASD 移动 / 近战 · 点击相邻地面或敌人</localized-text></span><span id="seedLabel"><localized-text data-i18n="ui.footsteps">灯火会记住你的脚步</localized-text></span></div>
    </section>
    <aside class="sidebar">
      <div class="hero-card"><div class="portrait"><span class="sprite hero-portrait"></span></div><div><span class="eyebrow"><localized-text data-i18n="ui.hero_caption">最后的守灯人</localized-text></span><h2><localized-text data-i18n="ui.hero_name">旅人</localized-text><span id="levelLabel">Lv. 1</span></h2><small id="heroSubtitle"><localized-text data-i18n="ui.hero_note">灯在，归途就在。</localized-text></small></div></div>
      <div class="vitals"><div class="stat-label"><span><localized-text data-i18n="ui.health">生命</localized-text></span><b id="hpText">42 / 42</b></div><div class="meter hp-meter"><i id="hpFill"></i></div><div class="stat-label xp-label"><span><localized-text data-i18n="ui.experience">灯火经验</localized-text></span><b id="xpText">0 / 7</b></div><div class="meter xp-meter"><i id="xpFill"></i></div><div class="attributes"><span><i class="sprite small sword-icon"></i><localized-text data-i18n="ui.attack">锋刃 </localized-text><b id="attackText">6</b></span><span><i class="sprite small shield-icon"></i><localized-text data-i18n="ui.armor">护甲 </localized-text><b id="armorText">1</b></span></div></div>
      <div class="skills"><div class="section-title"><localized-text data-i18n="ui.skills">旅人的技艺</localized-text><span><localized-text data-i18n="ui.action_turn">每次行动 · 一个回合</localized-text></span></div>
        <button id="whirlBtn" class="skill"><span class="sprite whirl-icon"></span><span><b><localized-text data-i18n="ui.whirl">旋风斩</localized-text><kbd>Q</kbd></b><small><localized-text data-i18n="ui.whirl_desc">横扫四邻格的敌人</localized-text></small></span><em id="whirlCd"><localized-text data-i18n="ui.ready">就绪</localized-text></em></button>
        <button id="boltBtn" class="skill"><span class="sprite bolt-icon"></span><span><b><localized-text data-i18n="ui.bolt">余烬弹</localized-text><kbd>E</kbd></b><small><localized-text data-i18n="ui.bolt_desc">射程 4 格 · 点击敌人指定目标</localized-text></small></span><em id="boltCd"><localized-text data-i18n="ui.ready">就绪</localized-text></em></button>
        <button id="healBtn" class="skill"><span class="sprite potion-icon"></span><span><b><localized-text data-i18n="ui.potion">治疗药水</localized-text><kbd>R</kbd></b><small><localized-text data-i18n="ui.potion_desc">恢复 18 生命 · 消耗一瓶</localized-text></small></span><em id="potionCount">×3</em></button>
        <button id="waitBtn" class="wait-button"><localized-text data-i18n="ui.wait">静候一回合 </localized-text><kbd>Space</kbd></button>
      </div>
      <div class="run-stats"><span><i class="sprite small skull-icon"></i><localized-text data-i18n="ui.kills_short">击败 </localized-text><b id="killsText">0</b></span><span><i class="sprite small coin-icon"></i><localized-text data-i18n="ui.gold">金币 </localized-text><b id="goldText">0</b></span></div>
      <div class="journal"><div class="section-title"><localized-text data-i18n="ui.journal">冒险日志</localized-text><span class="journal-mark">✦</span></div><div id="logLines" class="log-lines"><p><localized-text data-i18n="ui.journal_intro">石门之外，是未知的长夜。</localized-text></p></div></div>
      <div class="danger-note"><span>!</span><localized-text data-i18n="ui.warning_note"> 红色地格会在下一回合受到攻击。移动避开，灯火才会更长久。</localized-text></div>
    </aside>
  </main>
  <footer class="bottom"><span><localized-text data-i18n="ui.footer">四层长夜 · 一盏烬灯</localized-text></span><span><localized-text data-i18n="ui.footer_keys">Esc 暂停 &nbsp; F5 保存 &nbsp; F3 诊断</localized-text></span><span>EMBERKEEP <b>01</b></span></footer>
</div>
<script src="game.js"></script>
</body>
</html>
